<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜电台 · Midnight Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1420;
    --surface:#241A2B;
    --amber:#E8A33D;
    --teal:#6FA98A;
    --cream:#F2E9DC;
    --muted:#8C7C93;
    --line:rgba(242,233,220,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .sleeve{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:56px;
    align-items:center;
  }
  .disc-wrap{
    position:relative;
    aspect-ratio:1/1;
  }
  .disc{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at center,
        #100a14 0px, #100a14 2px,
        #180f1d 2px, #180f1d 4px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;
  }
  .disc::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(242,233,220,0.06), transparent 55%);
  }
  .label{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:38%;height:38%;
    border-radius:50%;
    background:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
  }
  .label span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:13px;
    color:#241608;
    line-height:1.3;
  }
  .spindle{
    position:absolute;
    top:50%;left:50%;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--bg);
    transform:translate(-50%,-50%);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--teal);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.08;
    letter-spacing:-0.01em;
    margin-bottom:14px;
  }
  .desc{
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
    max-width:38ch;
    margin-bottom:32px;
  }
  .tracklist{
    border-top:1px solid var(--line);
  }
  .track{
    display:grid;
    grid-template-columns:28px 1fr auto;
    gap:14px;
    align-items:baseline;
    padding:13px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .track .no{ color:var(--muted); }
  .track .name{ font-family:'Fraunces', serif; font-size:16px; font-weight:400; color:var(--cream); }
  .track .name small{ display:block; font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-top:3px; letter-spacing:0.03em; }
  .track .time{ color:var(--muted); }
  .track.now .no{ color:var(--amber); }
  .track.now .name{ color:var(--amber); }
  .meta{
    display:flex;
    gap:24px;
    margin-top:28px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .meta strong{ color:var(--cream); font-weight:400; }
  @media (max-width:720px){
    .sleeve{grid-template-columns:1fr; gap:36px;}
    .disc-wrap{max-width:260px; margin:0 auto;}
    h1{font-size:32px;}
  }
</style>
</head>
<body>
  <div class="sleeve">
    <div class="disc-wrap">
      <div class="disc">
        <div class="label"><span>MIDNIGHT<br>RADIO</span></div>
        <div class="spindle"></div>
      </div>
    </div>
    <div class="side">
      <p class="eyebrow">A 编 · Side A</p>
      <h1>深夜电台</h1>
      <p class="desc">一份献给凌晨两点的混音带。七首歌,从城市的灯火写到无人的海岸线。</p>

      <div class="tracklist">
        <div class="track now">
          <span class="no">01</span>
          <span class="name">午夜巴士<small>林间乐队</small></span>
          <span class="time">3:42</span>
        </div>
        <div class="track">
          <span class="no">02</span>
          <span class="name">盐与光<small>苏打气泡</small></span>
          <span class="time">4:05</span>
        </div>
        <div class="track">
          <span class="no">03</span>
          <span class="name">雨天便利店<small>晚风乐团</small></span>
          <span class="time">3:18</span>
        </div>
        <div class="track">
          <span class="no">04</span>
          <span class="name">星尘信<small>候鸟计划</small></span>
          <span class="time">3:56</span>
        </div>
        <div class="track">
          <span class="no">05</span>
          <span class="name">消失的车站<small>阿诚与朋友们</small></span>
          <span class="time">4:21</span>
        </div>
      </div>

      <div class="meta">
        <span>时长 <strong>19:22</strong></span>
        <span>风格 <strong>City Pop / Lo-fi</strong></span>
        <span>年份 <strong>2026</strong></span>
      </div>
    </div>
  </div>
</body>
</html>
