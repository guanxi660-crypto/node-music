# 构建并推送镜像, 供 mags deploy --image 使用
# 触发: push 到 main / 手动 workflow_dispatch
# 产出: ghcr.io/<owner>/node-music:main (默认) + 可选 Docker Hub
name: build-image

# 引号包裹, 避免 YAML 1.1 把 "on" 解析为布尔 true
"on":
  push:
    branches: [main]
  workflow_dispatch:

# 需要写 ghcr.io 包权限
permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,mode=max,scope=build-image

      - name: Print image tags
        run: echo ${{ steps.meta.outputs.tags }}
